    <script>
    window.dataLayer = window.dataLayer || [];

    gtag('config', 'G-16CGEV4QYZ');

<body>
    <script>
        function getOS() {
            var userAgent = window.navigator.userAgent,
                platform = window.navigator.platform,
                message = null;

            if (/Android/.test(userAgent)) {
                window.location.href = 'https://play.google.com/store/apps/details?id=id.glexpress.gle';
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = 'https://apps.apple.com/us/app/gle/id1575305633';
            } else {
                message = 'GLE only available for iOS and Android, please download directly from your smartphone';
                window.location.href = 'index.html';
            }
            return message;
        }
        var ms = getOS();
        if(ms != null){
            alert(getOS());
        }
        
    </script>
</body>
